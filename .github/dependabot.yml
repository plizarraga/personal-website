# No cooldown block: Dependabot waits 3 days by default before proposing a version update,
# longer than pnpm 11's default minimumReleaseAge (1 day).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Tijuana
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      production-patches-and-minors:
        dependency-type: production
        update-types: [minor, patch]
      development-patches-and-minors:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Tijuana
    commit-message:
      prefix: "chore(ci)"
